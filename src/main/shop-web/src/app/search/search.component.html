<div class="main-container">
  <div class="search-container">
    <div class="search-bar">
      <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
        <input
          type="text"
          nz-input
          placeholder="Search by name or description"
          [ngModel]="searchRequest.query"
          (ngModelChange)="onSearchQueryChange($event)"
        />
      </nz-input-group>
      <ng-template #suffixIconButton>
        <button nz-button nzType="primary" nzSearch>
          <nz-icon nzType="search" />
        </button>
      </ng-template>
    </div>
  </div>
  <div class="sub-container">
    @if (!isLoaded) {
      <div class="loader">
        <nz-spin nzTip="Loading..." nzSize="large"></nz-spin>
      </div>
    } @else {
      @let page = products!;
      <div class="sidebar">
        @for (facet of facets; track $index) {
          <app-product-facet [facet]="facet" (selectedOptions)="selectedOptionsChanged($event)"></app-product-facet>
        }
      </div>
      <div class="products-container">
        @for (product of page.content; track product.id) {
          <app-product [view]="productView" [product]="product"></app-product>
        }
        <div class="items-pagination">
          <nz-pagination
            [nzPageIndex]="page.number + 1"
            [nzTotal]="page.totalElements"
            [nzPageSize]="page.size"
            nzShowSizeChanger
            (nzPageIndexChange)="pageChanged($event)"
            (nzPageSizeChange)="numberOfItemsChanged($event)"
          ></nz-pagination>
        </div>
      </div>
    }
  </div>
</div>
