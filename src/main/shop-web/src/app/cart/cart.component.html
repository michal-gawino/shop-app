@if (cart.items.length > 0) {
  <nz-list nzItemLayout="vertical">
    @for (item of cart.items; track item) {
      <nz-list-item>
        <nz-list-item-meta-avatar></nz-list-item-meta-avatar>
        <nz-list-item-meta>
          <nz-list-item-meta-title>
            {{ item.product.title }} {{ item.product.price }} $
          </nz-list-item-meta-title>
        </nz-list-item-meta>
        {{ item.product.description }}
        <ul nz-list-item-actions>
          <nz-list-item-action>
            <nz-rate
              [ngModel]="item.product.rating"
              nzAllowHalf="true"
              nzDisabled
            ></nz-rate>
          </nz-list-item-action>
          <nz-list-item-action>
            <nz-input-number
              [(ngModel)]="item.quantity"
              nzMin="1"
              nzMax="100"
              nzKeyboard="false"
              (nzOnStep)="editItem($event, item)"
            ></nz-input-number>
          </nz-list-item-action>
          <nz-list-item-action>
            <button
              nz-button
              nzType="primary"
              nzDanger
              (click)="removeItem(item)"
            >
              Remove
            </button>
          </nz-list-item-action>
        </ul>
        <nz-list-item-extra>
          <img width="280" height="280" [src]="item.product.thumbnail" />
        </nz-list-item-extra>
      </nz-list-item>
    }
  </nz-list>
  <nz-divider nzPlain nzText="Summary" nzOrientation="left"></nz-divider>

  <h3>Total cart value: {{ cart.getTotalValue() }} $</h3>
} @else {
  <nz-empty
    nzNotFoundContent="You cart is empty"
    nzNotFoundImage="simple"
  ></nz-empty>
}
