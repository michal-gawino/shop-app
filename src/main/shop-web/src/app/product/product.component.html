<div class="main-container">
  <div class="search-container">
    <div class="search-bar">
      <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
        <input
          type="text"
          nz-input
          placeholder="Search by name or description"
        />
      </nz-input-group>
      <ng-template #suffixIconButton>
        <button nz-button nzType="primary" nzSearch>
          <nz-icon nzType="search" />
        </button>
      </ng-template>
    </div>
  </div>
  <div class="sub-container">
    @if (loading) {
      <div class="loader">
        <nz-spin nzTip="Loading..." nzSize="large"></nz-spin>
      </div>
    } @else {
      @let page = response!.page;
      @let facet = response!.facet;
      <div class="sidebar">
        {{ facet.categories }}
      </div>
      <div class="products-container">
        @for (product of page.content; track product.id) {
          <div class="product-container">
            <div class="product-image">
              <img [ngSrc]="product.thumbnail" fill priority/>
            </div>
            <div class="product-extra">
              <div>{{ product.title }}</div>
              <div>
                {{ product.price }} $
                <nz-rate
                  [ngModel]="product.rating"
                  nzDisabled
                  nzAllowHalf
                ></nz-rate>
              </div>
            </div>
          </div>
        }
        <div class="items-pagination">
          <nz-pagination
            [nzPageIndex]="page.number + 1"
            [nzTotal]="page.totalElements"
            [nzPageSize]="page.size"
            nzShowSizeChanger
            (nzPageIndexChange)="pageChanged($event)"
            (nzPageSizeChange)="numberOfItemsChanged($event)"
          ></nz-pagination>
        </div>
      </div>
    }
  </div>
</div>
