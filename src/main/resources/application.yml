server:
  port: 8080

web:
  url: ${web.url}

spring:
  application:
    name: shop-app
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.issuer}
  data:
    mongodb:
      uri: ${mongo.uri}

management:
  endpoints:
    web:
      exposure:
        include: health

upload:
  avatarFolder: ${avatars.location}

keycloak:
  uri: ${keycloak.uri}
  realm: shop-realm
  client: shop-client
  secret: ${keycloak.secret}
  issuer: ${keycloak.uri}/realms/${keycloak.realm}

